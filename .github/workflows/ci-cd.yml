name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/ai_research_test
      JWT_ACCESS_SECRET: test_access_secret_key_for_ci_pipeline_2026
      JWT_REFRESH_SECRET: test_refresh_secret_key_for_ci_pipeline_2026
      STORAGE_PROVIDER: local
      GEMINI_API_KEY: test_gemini_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & RAG evaluation tests
        run: npm test

      - name: Build production bundle
        run: npm run build

